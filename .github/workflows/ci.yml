name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AV1/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r AV1/requirements.txt
      - name: Validar a base da AV1
        run: python -B AV1/scripts/validar_artefatos.py AV1/artefatos
      - name: Executar os testes da AV2
        run: python -B -m unittest discover -s AV2/tests -t .
